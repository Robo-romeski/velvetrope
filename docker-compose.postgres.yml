# Optional Postgres stack: docker compose -f docker-compose.yml -f docker-compose.postgres.yml --profile postgres up --build
services:
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: velvet
      POSTGRES_PASSWORD: velvet
      POSTGRES_DB: velvetkey
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velvet -d velvetkey"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    profiles: ["postgres"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://velvet:velvet@postgres:5432/velvetkey
    volumes: []

volumes:
  postgres-data:
