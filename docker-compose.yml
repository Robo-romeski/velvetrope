services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=production
      - PORT=3010
      - APP_BASE_URL=http://localhost:3000
      - CORS_ORIGINS=http://localhost:3000
      - AUTH_SECRET=${AUTH_SECRET:-dev-auth-secret-change-me-32-chars!!}
      - DATABASE_PATH=/app/data/dev.db
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_test_123}
      - S3_ASSET_BUCKET=${S3_ASSET_BUCKET:-}
      - S3_PHOTO_BUCKET=${S3_PHOTO_BUCKET:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-false}
    volumes:
      - backend-data:/app/data
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
        NEXT_PUBLIC_POSTHOG_APP_LABEL: ${NEXT_PUBLIC_POSTHOG_APP_LABEL:-epicsexual}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - APP_BASE_URL=http://localhost:3000
      - API_SERVER_BASE_URL=http://backend:3010
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:3010
      - NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
      - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      - NEXT_PUBLIC_POSTHOG_APP_LABEL=${NEXT_PUBLIC_POSTHOG_APP_LABEL:-epicsexual}
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  backend-data:

networks:
  app-network:
    driver: bridge

