name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          AUTH0_ISSUER: https://test.auth0.com/
          AUTH0_AUDIENCE: test-audience
          DATABASE_TYPE: sqlite
          DATABASE_DATABASE: ':memory:'
          STRIPE_SECRET_KEY: sk_test_mock
          STRIPE_WEBHOOK_SECRET: whsec_mock

      - name: Build backend
        run: npm run build

  frontend-test:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run type-check
        continue-on-error: true

      - name: Build frontend
        run: npm run build
        env:
          AUTH0_SECRET: test-secret-minimum-32-characters-long
          AUTH0_BASE_URL: http://localhost:3000
          AUTH0_ISSUER_BASE_URL: https://test.auth0.com
          AUTH0_CLIENT_ID: test-client-id
          AUTH0_CLIENT_SECRET: test-client-secret
          NEXT_PUBLIC_API_URL: http://localhost:3010

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: velvetkey-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: velvetkey-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            AUTH0_SECRET=test-secret-minimum-32-characters-long
            AUTH0_BASE_URL=http://localhost:3000
            AUTH0_ISSUER_BASE_URL=https://test.auth0.com
            AUTH0_CLIENT_ID=test-client-id
            AUTH0_CLIENT_SECRET=test-client-secret
            NEXT_PUBLIC_API_URL=http://localhost:3010

  integration-check:
    name: Integration Health Check
    runs-on: ubuntu-latest
    needs: [docker-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create test .env file
        run: |
          cat > .env << EOF
          # Backend
          AUTH0_ISSUER=https://test.auth0.com/
          AUTH0_AUDIENCE=test-audience
          DATABASE_TYPE=sqlite
          DATABASE_DATABASE=./test.db
          STRIPE_SECRET_KEY=sk_test_mock
          STRIPE_WEBHOOK_SECRET=whsec_mock
          
          # Frontend
          AUTH0_SECRET=test-secret-minimum-32-characters-long-for-ci-testing
          AUTH0_BASE_URL=http://localhost:3000
          AUTH0_ISSUER_BASE_URL=https://test.auth0.com
          AUTH0_CLIENT_ID=test-client-id
          AUTH0_CLIENT_SECRET=test-client-secret
          NEXT_PUBLIC_API_URL=http://localhost:3010
          EOF

      - name: Start services with Docker Compose
        run: docker-compose up -d

      - name: Wait for backend health check
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3010/healthz; do sleep 2; done'

      - name: Wait for frontend
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3000; do sleep 2; done'

      - name: Check backend logs
        if: failure()
        run: docker-compose logs backend

      - name: Check frontend logs
        if: failure()
        run: docker-compose logs frontend

      - name: Tear down services
        if: always()
        run: docker-compose down -v

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Audit backend dependencies
        working-directory: ./backend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Audit frontend dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=high
        continue-on-error: true