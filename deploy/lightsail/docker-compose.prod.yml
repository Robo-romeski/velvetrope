# Production overlay for a single Lightsail instance.
# From repo root:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml \
#     -f deploy/lightsail/docker-compose.prod.yml --profile postgres up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./deploy/lightsail/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  backend:
    ports: !reset []
    restart: unless-stopped
    volumes:
      - backend-media:/app/data
    environment:
      - APP_BASE_URL=https://${DOMAIN}
      - PUBLIC_API_BASE_URL=https://api.${DOMAIN}
      - CORS_ORIGINS=https://${DOMAIN},https://www.${DOMAIN}
      - DATABASE_URL=postgres://velvet:${POSTGRES_PASSWORD}@postgres:5432/velvetkey
      - PAYMENTS_ENABLED=${PAYMENTS_ENABLED:-false}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - S3_PHOTO_BUCKET=${S3_PHOTO_BUCKET:-}
      - S3_ASSET_BUCKET=${S3_ASSET_BUCKET:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-}

  frontend:
    ports: !reset []
    restart: unless-stopped
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: https://api.${DOMAIN}
        NEXT_PUBLIC_PAYMENTS_ENABLED: ${NEXT_PUBLIC_PAYMENTS_ENABLED:-false}
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
        NEXT_PUBLIC_POSTHOG_APP_LABEL: ${NEXT_PUBLIC_POSTHOG_APP_LABEL:-epicsexual}
    environment:
      - APP_BASE_URL=https://${DOMAIN}
      - API_SERVER_BASE_URL=http://backend:3010
      - NEXT_PUBLIC_API_BASE_URL=https://api.${DOMAIN}
      - NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
      - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      - NEXT_PUBLIC_POSTHOG_APP_LABEL=${NEXT_PUBLIC_POSTHOG_APP_LABEL:-epicsexual}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-}

volumes:
  caddy-data:
  caddy-config:
  backend-media:
